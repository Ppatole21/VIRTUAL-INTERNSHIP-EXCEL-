<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Analytics Practice Site</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://googletagmanager.com"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JMWW030PDP');
    </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f7f6;">
    <h1 style="color: #333;">Welcome to my Google Analytics Practice Site!</h1>
    <p style="color: #666; font-size: 18px;">Your custom website is live and tracking traffic cleanly.</p>

    <!-- INTERACTIVE CASE STUDY TRACKING BUTTON -->
    <button id="excelReportBtn" style="padding: 15px 30px; font-size: 16px; background-color: #107c41; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        View My Excel Case Study
    </button>

    <!-- SCRIPT TO SEND BUTTON CLICK EVENTS -->
    <script>
        document.getElementById('excelReportBtn').addEventListener('click', function() {
            // Sends a custom event name straight into your Real-Time event charts
            gtag('event', 'excel_case_study_click', {
                'button_label': 'Green Excel Report Button',
                'project_name': 'Virtual Internship Data Analysis'
            });
            alert('Custom tracking event sent to your Google Analytics dashboard!');
        });
    </script>
</body>
</html>
